name: DBS Control smoke validation

on:
  push:
    branches:
      - main
      - "fix/dbs-control-smoke-validation"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate DBS Control inline scripts and wiring
        run: npm run test:dbs-control
      - name: Build application
        run: npm run build
