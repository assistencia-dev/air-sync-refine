name: DBS Control smoke validation

on:
  push:
    branches:
      - main
      - "fix/dbs-control-smoke-validation"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate DBS Control inline scripts and wiring
        run: bun run test:dbs-control
      - name: Validate concurrency, retry and outbox resilience contracts
        run: bun run test:dbs-resilience
      - name: Validate 50 concurrent collaborator sessions
        run: bun run test:dbs-50-sessions
      - name: Validate RH point corrections and exports
        run: bun run test:rh-point
      - name: Validate backup and retention contracts
        run: bun run test:data-protection
      - name: Build application
        run: bun run build
