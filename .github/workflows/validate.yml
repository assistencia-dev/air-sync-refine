name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate migration filenames and duplicate versions
        run: node scripts/check-migration-drift.mjs --local-only
      - name: Test applied migration SQL comparison
        run: bun run test:migration-drift
      - run: node scripts/test-module-recovery.cjs
      - run: node scripts/test-auth-boundary.cjs
      - run: node scripts/test-runtime-loader.cjs
      - run: node scripts/test-preview-imports.mjs
      - run: bun run lint -- --max-warnings=0
      - run: bun run test:performance
      - run: bun run test:operational
      - run: bun run test:inventory-financial
      - run: bun run test:treasury-ledger
      - run: bun run test:phase3-ledger-reporting
      - run: bun run test:dbs-base-scope
      - run: bun run test:rh-scale
      - run: bun run build
      - run: bunx tsc --noEmit --pretty false
