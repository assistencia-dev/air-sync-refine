name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'staging/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: DBS Control regression checks
        run: bun run test:dbs-control
      - name: Production build
        run: bun run build
