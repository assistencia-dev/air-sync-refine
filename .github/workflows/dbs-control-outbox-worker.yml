name: DBS Control outbox worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dbs-control-outbox-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate production secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL ausente"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY ausente"; exit 1; }
          test "$SUPABASE_URL" = "https://gdglototcrehvhkvcqsq.supabase.co" || { echo "::error::SUPABASE_URL não aponta para o projeto oficial"; exit 1; }

      - name: Drain transactional outbox
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-dbs-control-outbox-worker.mjs

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## DBS Control outbox: alerta"
            echo ""
            echo "Falha no worker, secrets ausentes/incorretos, backlog acima do SLA ou DLQ não vazia. Verifique os logs desta execução."
          } >> "$GITHUB_STEP_SUMMARY"
