name: Release readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    name: Regression contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run regression contracts and production build
        run: bun run build

      - name: Verify official production Supabase reference
        run: node scripts/check-supabase-project-ref.cjs
