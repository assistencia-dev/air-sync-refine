name: Supabase migration replay (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Replay migrations from an empty local database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Verify isolated target
        run: |
          supabase --version
          test -f supabase/config.toml
          grep -q '^project_id = "gdglototcrehvhkvcqsq"$' supabase/config.toml
          echo "Only the local Supabase stack is used. No production credentials or remote database URL are configured."

      - name: Start local Supabase services
        run: supabase start --exclude studio,mailpit,edge-runtime,logflare,vector,supavisor,imgproxy

      - name: Replay every migration against a clean database
        run: supabase db reset --local --no-seed

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
