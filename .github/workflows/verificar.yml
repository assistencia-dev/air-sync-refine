name: verificar
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-audit --no-fund --legacy-peer-deps
      - run: node scripts/test-dbs-control.cjs
      - run: npx vite build
