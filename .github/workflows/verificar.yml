name: verificar
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-audit --no-fund --legacy-peer-deps
      - run: node scripts/test-dbs-control.cjs
      - run: node scripts/test-dbs-control-resilience.cjs
      - run: node scripts/test-dbs-control-base-scope.cjs
      - run: node scripts/test-rh-point-integrity.cjs
      - run: node scripts/test-dbs-control-pdf.cjs
      - run: node scripts/test-inventory-financial-bridge.cjs
      - run: node scripts/test-data-protection.cjs
      - run: npx tsc --noEmit --pretty false
      - run: npx vite build
