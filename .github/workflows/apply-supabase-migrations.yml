name: Apply Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate the configured Supabase project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(sed -nE 's/^SUPABASE_PROJECT_ID="?([^"]+)"?$/\1/p' .env | head -n1)"
          supabase_url="$(sed -nE 's/^SUPABASE_URL="?([^"]+)"?$/\1/p' .env | head -n1)"
          if [[ -z "$project_id" || -z "$supabase_url" ]]; then
            echo "::error::SUPABASE_PROJECT_ID or SUPABASE_URL is missing from .env"
            exit 1
          fi
          if [[ "$supabase_url" != "https://${project_id}.supabase.co" ]]; then
            echo "::error::SUPABASE_PROJECT_ID does not match SUPABASE_URL in .env; refusing to migrate."
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Validated Supabase project ref: $project_id"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link configured project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::GitHub secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          supabase link --project-ref "${{ steps.project.outputs.project_id }}"

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all
