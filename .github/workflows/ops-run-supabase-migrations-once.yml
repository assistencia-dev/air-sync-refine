name: One-time authorized Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - ".ops/run-supabase-migrations-20261116"

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations-once
  cancel-in-progress: false

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[AUTHORIZED_SUPABASE_MIGRATIONS_20261116]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link official production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref gdglototcrehvhkvcqsq

      - name: Apply pending migrations from main
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all
