name: Temporary Bun lockfile regeneration
on:
  push:
    branches:
      - fix/bun-lock-and-profile-checks
permissions:
  contents: write
jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Regenerate the lockfile from package.json
        run: bun install
      - name: Commit the regenerated lockfile if changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix: synchronize Bun lockfile with package manifest"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "bun.lock is already synchronized."
          fi
      - name: Verify frozen installation
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
